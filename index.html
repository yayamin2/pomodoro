<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8"> <!-- permite acentos e ç -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- ajusta ao celular -->
  <title>Foco · Nova York</title> <!-- texto que aparece na aba do navegador -->
  <!-- Fonte do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
  <!-- Liga o arquivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Foco · Nova York</h1>
    <p>Uma coisa de cada vez. Escolha a linha, aperte o play e vá até a próxima parada.</p>
  </header>

  <!-- MAIN: o conteúdo principal da página -->
  <main class="page">
    <!-- TIMER: o card com o relógio e os botões -->
    <section class="timer">
      <div class="modo" id="modo">Foco</div> <!-- mostra: Foco, Pausa curta ou Pausa longa -->
      <div class="time" id="time">25:00</div>
      <div class="bar">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
      <!-- META: o aviso da próxima parada + as 4 bolinhas dos ciclos -->
      <div class="meta">
        <span id="proxima"></span>
        <div class="dots" id="dots"><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="btns">
        <button class="go" id="toggle">Começar</button>
        <button id="skip">Pular</button>
        <button id="reset">Reiniciar</button>
      </div>
    </section>
    <!-- TAREFAS: nome + minutos estimados. A lista (id="tasks") é desenhada pelo JavaScript -->
    <section class="card">
      <h2>Tarefas de hoje</h2>
      <div class="add">
        <input type="text" id="t-name" placeholder="Ex.: estudar arrays em Java">
        <input type="number" id="t-est" value="25" min="1" max="600" aria-label="Minutos estimados">
        <button class="go" id="add-task">Adicionar</button>
      </div>
      <div class="tasks" id="tasks"></div>
    </section>
  </main>

  <!-- JAVASCRIPT: fica no FIM do body para rodar só depois que a página inteira existe -->
  <script src="script.js"></script>
</body>

</html>
